<div class="row mb-3">
  <div class="col-12 text-center">
    <h3 class="fw-bold text-dark mb-1">🎟️ Registrar Jugada</h3>
    <p class="text-muted small">Selecciona la lotería, define tu modalidad e ingresa tus números de la suerte.</p>
  </div>
</div>

<div class="card shadow-sm border-0 rounded-4 max-width-mobile mx-auto">
  <div class="card-body p-4">
    <form id="form-efectuar-apuesta">
      
      <!-- Selector de Loterías Abiertas -->
      <div class="mb-3">
        <label class="form-label fw-bold text-secondary small">Lotería de Juego</label>
        <select class="form-select form-select-lg rounded-3" id="apuesta-loteria" required>
          <!-- Cargado mediante JavaScript -->
        </select>
      </div>

      <!-- Selector de Modalidades de Juego -->
      <div class="mb-3">
        <label class="form-label fw-bold text-secondary small">Modalidad</label>
        <select class="form-select form-select-lg rounded-3" id="apuesta-modalidad" required>
          <option value="fijo">Fijo (Paga x80)</option>
          <option value="corrido">Corrido (Paga x25)</option>
          <option value="parle">Parlé (Paga x1000)</option>
        </select>
      </div>

      <!-- Sección Numérica (00 - 99) -->
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label fw-bold text-secondary small">Número</label>
          <input type="text" class="form-control form-control-lg text-center fw-bold rounded-3" 
                 id="apuesta-num1" maxlength="2" pattern="[0-9]{2}" placeholder="00" required>
        </div>
        <div class="col d-none" id="contenedor-segundo-numero">
          <label class="form-label fw-bold text-secondary small">Segundo Número</label>
          <input type="text" class="form-control form-control-lg text-center fw-bold rounded-3" 
                 id="apuesta-num2" maxlength="2" pattern="[0-9]{2}" placeholder="00">
        </div>
      </div>

      <!-- Monto a Apostar -->
      <div class="mb-4">
        <label class="form-label fw-bold text-secondary small">Monto de la Apuesta ($)</label>
        <input type="number" step="0.5" min="0.5" class="form-control form-control-lg rounded-3" 
               id="apuesta-monto" placeholder="0.00" required>
      </div>

      <!-- Cuadro Informativo de Retorno Económico -->
      <div class="p-3 bg-light rounded-3 mb-4 text-center border">
        <span class="text-muted small d-block mb-1">Premio Potencial Estimado</span>
        <h3 class="text-success fw-bold mb-0">$<span id="ganancia-estimada">0.00</span></h3>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold shadow-sm">
        🎟️ Validar y Enviar Ticket
      </button>

    </form>
  </div>
</div>

<style>
  .max-width-mobile { max-width: 450px; }
</style>
