<div class="row justify-content-center">
  <div class="col-md-6">

    <div class="card shadow">

      <div class="card-header bg-primary text-white">
        <h4>Registro de Jugador</h4>
      </div>

      <div class="card-body">

        <form id="registro-form">

          <div class="mb-3">
            <label>Nombre</label>
            <input
              name="nombre"
              class="form-control"
              required>
          </div>

          <div class="mb-3">
            <label>WhatsApp</label>
            <input
              name="telefono_whatsapp"
              class="form-control"
              required>
          </div>

          <div class="mb-3">
            <label>Contraseña</label>
            <input
              type="password"
              name="password"
              class="form-control"
              required>
          </div>

          <button
            class="btn btn-success w-100">
            Registrarme
          </button>

        </form>

      </div>

    </div>

  </div>
</div>
