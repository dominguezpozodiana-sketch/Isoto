<div class="container-fluid">

  <div class="row">

    <div class="col-md-2 bg-dark text-white min-vh-100 p-3">

      <h4>La Bolita</h4>

      <hr>

      <button
        class="btn btn-outline-light w-100 mb-2"
        onclick="router.navegarA('/admin/dashboard')">
        Dashboard
      </button>

      <button
        class="btn btn-outline-light w-100 mb-2"
        onclick="router.navegarA('/admin/jugadores')">
        Jugadores
      </button>

      <button
        class="btn btn-outline-light w-100 mb-2">
        Recargas
      </button>

      <button
        class="btn btn-outline-light w-100 mb-2"
        onclick="router.navegarA('/admin/resultados')">
        Resultados
      </button>

      <button
        class="btn btn-outline-light w-100 mb-2"
        onclick="router.navegarA('/admin/reportes')">
        Reportes
      </button>

      <button
        class="btn btn-danger w-100 mt-4"
        onclick="auth.logout()">
        Cerrar sesión
      </button>

    </div>

    <div class="col-md-10 p-4">

      <h2>Dashboard General</h2>

      <div class="row mt-4">

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h6>Ventas Hoy</h6>
              <h3 id="ventas_hoy">$0</h3>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h6>Premios Hoy</h6>
              <h3 id="premios_hoy">$0</h3>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h6>Ganancia</h6>
              <h3 id="ganancia_hoy">$0</h3>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <div class="card-body">
              <h6>Jugadores</h6>
              <h3 id="jugadores">0</h3>
            </div>
          </div>
        </div>

      </div>

      <div class="card mt-4">

        <div class="card-header">
          Últimas apuestas
        </div>

        <div class="card-body">

          <table class="table">
            <thead>
              <tr>
                <th>Jugador</th>
                <th>Número</th>
                <th>Monto</th>
                <th>Estado</th>
              </tr>
            </thead>

            <tbody id="ultimas_apuestas">
            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

</div>
