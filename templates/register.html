{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2 class="text-center font-bold" style="font-size: 1.5rem;">Registro de usuario</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{% if category=='error' %}error{% elif category=='warning' %}warning{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" id="registerForm" onsubmit="disableButton(event)">
        <div class="mb-4">
            <label class="font-bold text-sm">Número de móvil</label>
            <div class="flex">
                <span style="display: inline-flex; align-items: center; padding: 0 0.75rem; background-color: #e5e7eb; border: 1px solid #d1d5db; border-right: none; border-radius: 0.375rem 0 0 0.375rem;">+53</span>
                <input type="tel" name="numero" required style="border-radius: 0 0.375rem 0.375rem 0;" placeholder="Ej: 51234567">
            </div>
        </div>
        <div class="mb-4">
            <label class="font-bold text-sm">Nombre de usuario</label>
            <input type="text" name="nombre" required>
        </div>
        <div class="mb-4">
            <label class="font-bold text-sm">Contraseña</label>
            <input type="password" name="contrasena" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-success w-full flex justify-center items-center">
            <span id="btnText">Continuar</span>
            <span id="btnSpinner" class="hidden ml-2">
                <svg class="spinner" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
        </button>
    </form>
    <p class="text-center text-sm mt-4">¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-blue-500">Inicia sesión</a></p>
</div>

<script>
    function disableButton(event) {
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        if (btn.disabled) {
            event.preventDefault();
            return;
        }
        btn.disabled = true;
        btnText.textContent = 'Enviando...';
        btnSpinner.classList.remove('hidden');
    }
</script>
{% endblock %}
